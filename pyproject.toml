[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neven"
version = "2.1.0"
description = "NEVEN TECH — The Physical World Runtime. Connect AI agents to any physical infrastructure."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "NEVEN Technologies", email = "engineering@neventech.com"},
]
keywords = ["ai", "iot", "smart-city", "computer-vision", "physical-ai", "edge-computing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet of Things",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
]
full = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "redis>=4.5.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://neventech.com"
Documentation = "https://docs.neventech.com"
Repository = "https://github.com/neventech/neven"
Issues = "https://github.com/neventech/neven/issues"

[project.scripts]
neven = "neven.cli.main:main"
neven-mcp = "neven.mcp.server:main"

[tool.setuptools.packages.find]
include = ["neven*"]

[tool.setuptools.package-data]
neven = ["*.json", "*.yaml", "*.html"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
