[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neven-sdk"
version = "1.0.0"
description = "Physical Intelligence as a Service — Connect any AI agent to the physical world"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "NEVEN Technologies", email = "sdk@neventech.com"}
]
keywords = ["ai", "agents", "physical-ai", "iot", "smart-city", "autonomous-agents", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "websocket-client>=1.7.0",
    "cryptography>=41.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8.0", "Pillow>=10.0.0"]
audio = ["sounddevice>=0.4.6", "numpy>=1.24.0"]
full = ["neven-sdk[vision,audio]"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "httpretty>=1.1.4"]

[project.urls]
Homepage = "https://neventech.com"
Documentation = "https://docs.neventech.com"
Repository = "https://github.com/neventech/neven-sdk"
Issues = "https://github.com/neventech/neven-sdk/issues"

[project.scripts]
neven = "neven.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neven*"]
